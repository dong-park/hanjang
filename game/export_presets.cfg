[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>
html,body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-touch-callout:none}
canvas{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#rotate-hint{display:none;position:fixed;inset:0;z-index:99999;background:#12162b;color:#e8ecff;flex-direction:column;align-items:center;justify-content:center;font:700 26px/1.5 -apple-system,sans-serif;text-align:center}
#rotate-hint b{display:block;font-size:64px;transform:rotate(90deg);margin-bottom:12px}
@media (orientation:portrait) and (pointer:coarse){#rotate-hint{display:flex}}
</style>
<script>
(function(){
var stop=function(e){e.preventDefault()};
['gesturestart','gesturechange','gestureend','contextmenu','dblclick'].forEach(function(n){document.addEventListener(n,stop,{passive:false})});
document.addEventListener('touchmove',function(e){if(!e.target||e.target.tagName!=='INPUT')e.preventDefault()},{passive:false});
var last=0;document.addEventListener('touchend',function(e){var t=Date.now();if(t-last<350)e.preventDefault();last=t},{passive:false});
if(window.visualViewport)visualViewport.addEventListener('resize',function(){scrollTo(0,0)});
document.addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.id='rotate-hint';d.innerHTML='<b>&#8635;</b>가로로 돌려 주세요<br><small style=\"font-size:16px;font-weight:400;opacity:.7\">돌리면 게임이 이어집니다</small>';document.body.appendChild(d)});
})();
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false
